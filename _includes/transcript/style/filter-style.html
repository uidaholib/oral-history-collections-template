{%- comment -%}
  A color class for each topic in _data/filters.csv (.<tag-slug> { fill; border-color }).
  Colors: _includes/transcript/topic-colors.html.
{%- endcomment -%}
{%- include transcript/topic-colors.html -%}
<style>
    {% for n in site.data.filters %}
    {%- assign slug = n.tag | slugify -%}
    {%- assign position = forloop.index0 | modulo: 20 -%}
    {%- assign color = topic-palette[position] -%}
  .{{ slug }} {
    fill: {{ color }};
    border-color: {{ color }};
  }
  {% endfor %}
</style>
