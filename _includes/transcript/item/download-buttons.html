<!-- cb: _includes/transcript/item/download-buttons.html -->
<div class="btn-group meta" role="group" aria-label="Interview actions">
<button data-bs-toggle="modal" data-bs-target="#metadata-modal" class="btn btn-outline-dark">View Item Info</button>
<!-- 
{% if page.date %}{%- capture year -%}{% if page.date contains "-" %}{{ page.date | split: "-" | first }}{% elsif page.date contains "/" %}{{ page.date | split: "/" | last }}{% else %}{{ page.date }}{% endif %}{%- endcapture -%}
<a href="{{ year | strip | prepend: '/timeline.html#y' | relative_url }}" class="btn btn-outline-dark">View on Timeline</a>{% endif %}
{% if page.latitude and page.longitude %}
<a href="{{ '/map.html?location=' | append: page.latitude  | append: ',' | append: page.longitude | append: '&marker=' | append: page.objectid | relative_url}}" class="btn btn-outline-dark">View on Map</a>{% endif %}-->
{% assign transcript_rows = site.data.transcripts[page.objectid] %}
{% if page.pdf %}
<a target="_blank" rel="noopener" href="{{ page.pdf | relative_url }}" class="btn btn-outline-dark">Original Transcript</a>
{% endif %}
{% if transcript_rows.size > 1 %}
<button type="button" onclick="preparePDF()" class="btn btn-outline-dark">Generate PDF</button>
{% if site.data.theme.json-generation %}
<a href="{{ '/assets/data/transcripts/' | append: page.objectid | append: '.json' | relative_url }}" class="btn btn-outline-dark" download>Download JSON</a>
{% endif %}
{% endif %}
</div>
