<script>
/*
 * Interview page: topic filter, text search, stepping through the results, and links to a line.
 * Markup: _includes/transcript/item/filters.html (the bar) and item/transcript.html (the lines).
 *
 *  - One state object; every control is redrawn from it by render(), so the topic menu,
 *    the topic buttons, the topic bar (window.ohdStrip, js/topic-strip-js.html), the
 *    stepper and the URL can't drift apart.
 *  - Lines that don't match are dimmed by color only. Nothing is resized, so the
 *    transcript never reflows and the reader keeps their place.
 *  - Search reads the text of each line (not its HTML) and marks every match.
 *  - URL: ?filter=<topic-slug>  ?q=<search>  ?line=<line id>  (or #<line id>)
 *
 * Kept for markup and customizations written against earlier versions:
 *   filterLines(slug)  vizFilter(slug | 'all')  searchLines(text)  resetVals()  scrollToLine(lineId)
 */
(function () {
  'use strict';

  var PAGE_ID = {{ page.objectid | jsonify }};
  // slug -> the tag as written in _data/filters.csv
  var TOPIC_LABELS = { {% for f in site.data.filters %}{{ f.tag | slugify | jsonify }}: {{ f.tag | strip | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %} };

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var lines = [];   // [{ el, words, tags: [slug] }] in transcript order
  var byId = {};    // line element id -> index
  var ui = {};      // elements of the bar, filled by init()
  var state = {
    topic: null,    // slug of the selected topic
    q: '',          // search text
    stops: [],      // what the stepper walks: [{ start, end }] line indexes (a passage, or one matching line)
    matched: 0,     // lines matching the topic or search
    at: -1,         // index in stops of the result last stepped to
    current: -1     // line last jumped to
  };

  function byIdEl(id) { return document.getElementById(id); }

  function announce(message) {
    if (ui.announcer) ui.announcer.textContent = message;
  }

  function plural(n, word) { return n.toLocaleString() + ' ' + word + (n === 1 ? '' : 's'); }

  function topicLabel(slug) { return TOPIC_LABELS[slug] || slug; }

  /* ---------- reading the page ---------- */

  function readLines() {
    var container = byIdEl('contents-container');
    if (!container) return;
    Array.prototype.forEach.call(container.querySelectorAll('.line'), function (el, i) {
      lines.push({ el: el, words: el.querySelector('.words'), tags: (el.dataset.tags || '').split(/\s+/).filter(Boolean) });
      byId[el.id] = i;
    });
  }

  /* ---------- search highlighting ---------- */

  function escapeRegex(text) { return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // the text of a line, without the speaker's name
  function textNodes(words) {
    var nodes = [];
    var walker = document.createTreeWalker(words, NodeFilter.SHOW_TEXT, null);
    var node;
    while ((node = walker.nextNode())) {
      if (!(node.parentElement && node.parentElement.closest('.speaker'))) nodes.push(node);
    }
    return nodes;
  }

  // wraps every match in the line in <mark>; false when there is none
  function markMatches(words, pattern) {
    var found = false;
    textNodes(words).forEach(function (node) {
      var text = node.nodeValue;
      pattern.lastIndex = 0;
      var match = pattern.exec(text);
      if (!match) return;
      found = true;
      var pieces = document.createDocumentFragment();
      var from = 0;
      while (match) {
        if (match.index > from) pieces.appendChild(document.createTextNode(text.slice(from, match.index)));
        var mark = document.createElement('mark');
        mark.className = 'ohd-hit';
        mark.textContent = match[0];
        pieces.appendChild(mark);
        from = match.index + match[0].length;
        match = pattern.exec(text);
      }
      if (from < text.length) pieces.appendChild(document.createTextNode(text.slice(from)));
      node.parentNode.replaceChild(pieces, node);
    });
    return found;
  }

  function clearMarks() {
    lines.forEach(function (line) {
      if (!line.words) return;
      var marks = line.words.querySelectorAll('mark.ohd-hit');
      if (!marks.length) return;
      Array.prototype.forEach.call(marks, function (mark) {
        mark.parentNode.replaceChild(document.createTextNode(mark.textContent), mark);
      });
      line.words.normalize();
    });
  }

  /* ---------- state -> page ---------- */

  function active() { return !!(state.topic || state.q); }

  function show(el, visible) { if (el) el.classList.toggle('d-none', !visible); }

  function countText() {
    var n = state.stops.length;
    if (!n) return 'No matches';
    var unit = state.topic ? 'passage' : 'line';
    if (state.at < 0) return plural(n, unit);
    return (state.at + 1).toLocaleString() + ' of ' + n.toLocaleString();
  }

  function summary() {
    if (state.topic) {
      return plural(state.stops.length, 'passage') + ' (' + plural(state.matched, 'line') + ') tagged ' + topicLabel(state.topic);
    }
    return plural(state.matched, 'line') + ' match' + (state.matched === 1 ? 'es' : '') + ' "' + state.q + '"';
  }

  function writeUrl() {
    var url = new URL(window.location);
    var set = function (key, value) { if (value) url.searchParams.set(key, value); else url.searchParams.delete(key); };
    set('filter', state.topic);
    set('q', state.q);
    set('line', state.current >= 0 ? lines[state.current].el.id : null);
    url.hash = '';
    window.history.replaceState({}, '', url.pathname + url.search);
  }

  // the bar, the menu, the topic bar and the URL, from state
  function render() {
    var on = active();
    show(ui.results, on);
    if (ui.count) {
      ui.count.textContent = on ? countText() : '';
      ui.count.title = on ? summary() : '';
    }
    if (ui.prev) ui.prev.disabled = !state.stops.length;
    if (ui.next) ui.next.disabled = !state.stops.length;
    if (ui.menu) ui.menu.value = state.topic && ui.menu.querySelector('option[value="' + state.topic.replace(/"/g, '\\"') + '"]') ? state.topic : 'all';
    if (ui.search && ui.search.value.trim() !== state.q) ui.search.value = state.q;
    writeUrl();
  }

  // which lines are featured or dimmed, from state
  function paint(matches) {
    var on = active();
    lines.forEach(function (line, i) {
      line.el.classList.toggle('featured', on && matches[i] === true);
      line.el.classList.toggle('dimmed', on && matches[i] !== true);
    });
  }

  /* ---------- actions ---------- */

  function setTopic(slug) {
    if (!slug || slug === 'all') { clearAll(); return; }
    clearMarks();
    state.topic = slug;
    state.q = '';
    state.stops = [];
    state.matched = 0;
    state.at = -1;
    var matches = [];
    var run = null;
    lines.forEach(function (line, i) {
      if (line.tags.indexOf(slug) > -1) {
        matches[i] = true;
        state.matched++;
        if (run) run.end = i; else { run = { start: i, end: i }; state.stops.push(run); }
      } else {
        run = null;
      }
    });
    paint(matches);
    if (window.ohdStrip) window.ohdStrip.setTopic(slug);
    render();
    announce(summary());
  }

  function setQuery(text) {
    var q = (text || '').trim();
    if (!q) { clearAll(); return; }
    clearMarks();
    state.topic = null;
    state.q = q;
    state.stops = [];
    state.matched = 0;
    state.at = -1;
    var pattern = new RegExp(escapeRegex(q), 'gi');
    var matches = [];
    var hits = [];
    lines.forEach(function (line, i) {
      if (line.words && markMatches(line.words, pattern)) {
        matches[i] = true;
        hits.push(i);
        state.stops.push({ start: i, end: i });
      }
    });
    state.matched = hits.length;
    paint(matches);
    if (window.ohdStrip) window.ohdStrip.setHits(hits);
    render();
    announce(summary());
  }

  function clearAll() {
    clearMarks();
    state.topic = null;
    state.q = '';
    state.stops = [];
    state.matched = 0;
    state.at = -1;
    setCurrent(-1);
    paint([]);
    if (ui.search) ui.search.value = '';
    if (window.ohdStrip) window.ohdStrip.clear();
    render();
    announce('Filters and search cleared');
  }

  // only one line at a time is the current one
  function setCurrent(i) {
    if (state.current >= 0 && lines[state.current]) {
      lines[state.current].el.classList.remove('border-featured');
      lines[state.current].el.removeAttribute('tabindex');
    }
    state.current = i;
    if (i >= 0) {
      lines[i].el.classList.add('border-featured');
      lines[i].el.setAttribute('tabindex', '-1');
    }
    if (window.ohdStrip) window.ohdStrip.setCurrent(i >= 0 ? lines[i].el : null);
  }

  // an interview with an index shows the transcript in a tab; make sure it is the open one
  function showTranscriptTab(then) {
    var tab = byIdEl('transcript-tab');
    if (!tab || tab.classList.contains('active') || !window.bootstrap || !bootstrap.Tab) { then(); return; }
    tab.addEventListener('shown.bs.tab', then, { once: true });
    bootstrap.Tab.getOrCreateInstance(tab).show();
  }

  /**
   * Go to a line: by index, by element id ("armantrout12"), or by number as text ("12").
   * options.smooth === false jumps without animation (used on page load).
   */
  function goToLine(target, options) {
    options = options || {};
    var i = -1;
    if (typeof target === 'number') i = target;
    else if (byId.hasOwnProperty(target)) i = byId[target];
    else if (byId.hasOwnProperty(PAGE_ID + target)) i = byId[PAGE_ID + target];
    if (i < 0 || !lines[i]) return false;

    setCurrent(i);
    // keep the stepper in step when the line is one of its results
    if (!options.fromStepper) {
      state.at = -1;
      for (var k = 0; k < state.stops.length; k++) {
        if (i >= state.stops[k].start && i <= state.stops[k].end) { state.at = k; break; }
      }
    }
    render();

    showTranscriptTab(function () {
      lines[i].el.scrollIntoView({ behavior: options.smooth === false || reduceMotion ? 'auto' : 'smooth', block: 'center' });
      if (options.focus !== false) lines[i].el.focus({ preventScroll: true });
    });
    if (!options.quiet) announce('Line ' + (i + 1) + ' of ' + lines.length);
    return true;
  }

  // First use of the stepper starts from where the reader is, not from the top.
  function nearestStop(direction) {
    var edge = window.innerHeight * 0.3;
    var k;
    if (direction > 0) {
      for (k = 0; k < state.stops.length; k++) {
        if (lines[state.stops[k].start].el.getBoundingClientRect().top > edge) return k;
      }
      return 0;
    }
    for (k = state.stops.length - 1; k >= 0; k--) {
      if (lines[state.stops[k].start].el.getBoundingClientRect().top < 0) return k;
    }
    return state.stops.length - 1;
  }

  function step(direction) {
    var n = state.stops.length;
    if (!n) return;
    state.at = state.at < 0 ? nearestStop(direction) : (state.at + direction + n) % n;
    var stop = state.stops[state.at];
    goToLine(stop.start, { fromStepper: true, quiet: true });
    announce((state.topic ? 'Passage ' : 'Match ') + (state.at + 1) + ' of ' + n +
      (stop.end > stop.start ? ', lines ' + (stop.start + 1) + ' to ' + (stop.end + 1) : ', line ' + (stop.start + 1)));
  }

  /* ---------- earlier function names ---------- */

  window.filterLines = setTopic;
  window.vizFilter = setTopic;
  window.searchLines = setQuery;
  window.resetVals = clearAll;
  window.scrollToLine = function (lineId) { return goToLine(lineId); };

  /* ---------- start ---------- */

  function init() {
    ui = {
      menu: byIdEl('filters'),
      search: byIdEl('quicksearch'),
      go: byIdEl('goButton'),
      results: byIdEl('filtersearch-dropdown'),
      count: byIdEl('numberof'),
      prev: byIdEl('find-prev'),
      next: byIdEl('find-next'),
      reset: byIdEl('find-reset'),
      announcer: byIdEl('search-status-announcer')
    };
    readLines();

    if (ui.menu) ui.menu.addEventListener('change', function () { setTopic(ui.menu.value); });
    if (ui.go) ui.go.addEventListener('click', function () { setQuery(ui.search ? ui.search.value : ''); });
    if (ui.search) {
      ui.search.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        // Enter again on the same search steps to the next match (Shift+Enter: previous)
        if (state.q && ui.search.value.trim() === state.q) step(event.shiftKey ? -1 : 1);
        else setQuery(ui.search.value);
      });
      // the field's own clear (x) button
      ui.search.addEventListener('search', function () { if (!ui.search.value && state.q) clearAll(); });
    }
    if (ui.prev) ui.prev.addEventListener('click', function () { step(-1); });
    if (ui.next) ui.next.addEventListener('click', function () { step(1); });
    if (ui.reset) ui.reset.addEventListener('click', clearAll);

    // state from the URL. A topic or search is applied where the page opens; only a
    // link to a line scrolls.
    var params = new URL(window.location).searchParams;
    var hash = '';
    try { hash = decodeURIComponent(location.hash.substr(1)); } catch (e) { hash = ''; }
    var line = params.get('line') || (byId.hasOwnProperty(hash) ? hash : '');
    if (params.get('q')) setQuery(params.get('q'));
    else if (params.get('filter')) setTopic(params.get('filter'));
    if (line) goToLine(line, { smooth: false, focus: false, quiet: true });

    if (window.bootstrap && typeof bootstrap.Tooltip === 'function') {
      Array.prototype.forEach.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'), function (el) {
        new bootstrap.Tooltip(el);
      });
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var filtersSearch = byIdEl('filters-search');
    var filterTab = byIdEl('filter-tab');
    var sentinel = byIdEl('filters-sentinel');

    {% unless site.data.theme.search-and-filters == false or site.data.theme.search-and-filters-sticky == false %}
    // The pull tab hides and shows the bar while it is stuck to the top of the window.
    // Only the reader operates it; the page never hides the bar.
    if (filterTab && filtersSearch) {
      var setRetracted = function (retracted) {
        filtersSearch.classList.toggle('retracted', retracted);
        filterTab.setAttribute('aria-expanded', retracted ? 'false' : 'true');
      };
      filterTab.addEventListener('click', function () {
        setRetracted(!filtersSearch.classList.contains('retracted'));
      });
      if (sentinel && window.IntersectionObserver) {
        // The root reaches far below the window, so the marker above the bar counts as
        // "in view" until it passes the top edge - also when the page jumps past it.
        new IntersectionObserver(function (entries) {
          var stuck = !entries[entries.length - 1].isIntersecting;
          filterTab.classList.toggle('d-none', !stuck);
          if (!stuck) setRetracted(false);
        }, { rootMargin: '0px 0px 1000000px 0px' }).observe(sentinel);
      }
    }
    {% endunless %}

    init();
  });
})();
</script>
